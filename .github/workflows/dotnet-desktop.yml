name: WPF CI

on:
  push:
    branches:
      - master
      - Development

  pull_request:
    branches:
      - master
      - Development

jobs:
  build:
    name: Build WPF Application
    runs-on: windows-2025

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ScanProcedure.slnx

      - name: Build
        run: dotnet build ScanProcedure.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ScanProcedure.slnx --configuration Release --no-build

      - name: Publish
        run: dotnet publish ScanProcedure.csproj --configuration Release --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanProcedure-${{ github.sha }}
          path: ./publish
